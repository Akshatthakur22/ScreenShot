[package]
name = "akshat-app"
description = "Screenshot search window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "akshat-app"
path = "src/main.rs"

[dependencies]
akshat-core.workspace = true
anyhow.workspace = true
directories.workspace = true
# Pinned to zed main rather than the 0.2.2 release on crates.io. The release
# renders through blade, which is Vulkan only. Main moved to wgpu with a GL
# fallback, so the window still opens on old integrated graphics.
gpui = { git = "https://github.com/zed-industries/zed", rev = "0fb9a9da49993ee8061ff4a2feaa89966a79e91c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "0fb9a9da49993ee8061ff4a2feaa89966a79e91c", features = ["font-kit", "wayland", "x11"] }
env_logger = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2"
libc = "0.2"
smallvec = "1"
unicode-segmentation = "1"
